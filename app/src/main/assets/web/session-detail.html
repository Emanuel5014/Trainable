<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainable — Dettaglio Sessione</title>
  <meta name="theme-color" content="#3A59D1">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/icon.png" alt="Trainable" width="32" height="32" style="border-radius: 6px;">
      </a>
      <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/analytics">Analytics</a>
        <a href="/plans">Piani</a>
        <a href="/sessions">Sessioni</a>
      </div>
      <div class="nav-actions">
        <button class="theme-switch" id="themeToggle" aria-label="Toggle theme">
          <svg class="sw-icon sw-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="sw-icon sw-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span class="sw-thumb"></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <p class="page-subtitle" id="session-plan">Caricamento...</p>
      <h1 class="page-title" id="session-date">-</h1>
      <div style="margin-top: 16px; display: flex; gap: 12px; justify-content: center;">
        <span class="badge badge-primary" id="session-volume">- kg</span>
        <span class="badge badge-neutral" id="session-sets">- set</span>
      </div>
    </div>
  </div>

  <main class="container">
    <!-- Back button -->
    <a href="/sessions" class="btn btn-secondary" style="margin-bottom: 24px;">
      <span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
      Torna alle sessioni
    </a>

    <div id="exercises-container">
      <div class="loading"><div class="loading-spinner"></div></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer-copy">2026 Trainable App. Licensed under GPL v3.</p>
      <p class="footer-made">Made with <span class="footer-heart">&#9829;</span> by Emanuel5014</p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
