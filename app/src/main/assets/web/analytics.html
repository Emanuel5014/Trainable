<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titleAnalytics">Trainable — Analytics</title>
  <meta name="theme-color" content="#3A59D1">
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/icon.png" alt="Trainable" width="32" height="32" style="border-radius: 6px;">
      </a>
      <div class="nav-links">
        <a href="/" data-i18n="navDashboard">Dashboard</a>
        <a href="/analytics" class="active" data-i18n="navAnalytics">Analytics</a>
        <a href="/plans" data-i18n="navPlans">Piani</a>
        <a href="/sessions" data-i18n="navSessions">Sessioni</a>
      </div>
      <div class="nav-actions">
        <button class="theme-switch" id="themeToggle" aria-label="Toggle theme">
          <svg class="sw-icon sw-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="sw-icon sw-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span class="sw-thumb"></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="page-header" style="min-height:160px;">
    <div>
      <h1 class="page-title" data-i18n="pageAnalytics">Analytics</h1>
      <p class="page-subtitle" data-i18n="subAnalytics">Analisi dettagliate dei tuoi progressi</p>
    </div>
  </div>

  <main class="container">

    <!-- Body Weight Chart -->
    <div class="section-header">
      <div>
        <h2 class="section-title" data-i18n="bodyWeight">Peso Corporeo</h2>
        <div class="section-subtitle"></div>
      </div>
      <div class="period-selector" data-target="body-weight">
        <button class="period-btn" data-period="7" data-i18n="period7d">7g</button>
        <button class="period-btn active" data-period="30" data-i18n="period30d">30g</button>
        <button class="period-btn" data-period="90" data-i18n="period90d">90g</button>
        <button class="period-btn" data-period="180" data-i18n="period6m">6m</button>
        <button class="period-btn" data-period="365" data-i18n="period1y">1a</button>
        <button class="period-btn" data-period="0" data-i18n="periodAll">Tutto</button>
      </div>
    </div>
    <div class="chart-container" id="body-weight-chart">
      <canvas id="body-weight-canvas" class="chart-canvas"></canvas>
    </div>

    <!-- Volume by Muscle Group -->
    <div class="section-header" style="margin-top:48px;">
      <div>
        <h2 class="section-title" data-i18n="volumeByCategory">Volume per Gruppo Muscolare</h2>
        <div class="section-subtitle"></div>
      </div>
      <div class="period-selector" data-target="volume-category">
        <button class="period-btn" data-period="7" data-i18n="period7d">7g</button>
        <button class="period-btn active" data-period="30" data-i18n="period30d">30g</button>
        <button class="period-btn" data-period="90" data-i18n="period90d">90g</button>
        <button class="period-btn" data-period="180" data-i18n="period6m">6m</button>
        <button class="period-btn" data-period="365" data-i18n="period1y">1a</button>
        <button class="period-btn" data-period="0" data-i18n="periodAll">Tutto</button>
      </div>
    </div>
    <div class="chart-container" id="volume-category-chart">
      <canvas id="volume-category-canvas" class="chart-canvas"></canvas>
    </div>

    <!-- Per-Plan Tonnage Charts -->
    <div class="section-header" style="margin-top:48px;">
      <div>
        <h2 class="section-title" data-i18n="tonnagePerPlan">Tonnellaggio per Scheda</h2>
        <div class="section-subtitle"></div>
      </div>
      <div class="period-selector" data-target="plan-tonnage">
        <button class="period-btn active" data-period="30" data-i18n="period30d">30g</button>
        <button class="period-btn" data-period="90" data-i18n="period90d">90g</button>
        <button class="period-btn" data-period="180" data-i18n="period6m">6m</button>
        <button class="period-btn" data-period="365" data-i18n="period1y">1a</button>
        <button class="period-btn" data-period="0" data-i18n="periodAll">Tutto</button>
      </div>
    </div>
    <div id="plan-tonnage-charts"></div>

    <!-- 1RM Progress -->
    <div class="section-header" style="margin-top:48px;">
      <div>
        <h2 class="section-title" data-i18n="max1RM">Massimale 1RM</h2>
        <div class="section-subtitle"></div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <input id="exercise-input" placeholder="Cerca esercizio..." autocomplete="off" class="exercise-input" data-i18n="searchExercise" />
        <m3e-autocomplete for="exercise-input" filter="contains" id="exercise-autocomplete" panel-class="exercise-dropdown-panel">
        </m3e-autocomplete>
        <div class="period-selector" data-target="exercise-progress">
          <button class="period-btn active" data-period="30" data-i18n="period30d">30g</button>
          <button class="period-btn" data-period="90" data-i18n="period90d">90g</button>
          <button class="period-btn" data-period="180" data-i18n="period6m">6m</button>
          <button class="period-btn" data-period="365" data-i18n="period1y">1a</button>
          <button class="period-btn" data-period="0" data-i18n="periodAll">Tutto</button>
        </div>
      </div>
    </div>
    <div class="chart-container" id="exercise-progress-chart">
      <div class="exercise-progress-summary" id="exercise-progress-summary"></div>
      <canvas id="exercise-progress-canvas" class="chart-canvas" style="display:none;"></canvas>
      <div class="loading" id="exercise-progress-loading" style="display:none;"><div class="loading-spinner"></div></div>
    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer-copy" data-i18n="copyright">2026 Trainable App. Licensed under GPL v3.</p>
      <p class="footer-made" data-i18n="madeWith">Made with <span class="footer-heart">&#9829;</span> by Emanuel5014</p>
    </div>
  </footer>

  <script type="module" src="/lib/m3e/all.min.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
